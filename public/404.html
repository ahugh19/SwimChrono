<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      // GitHub Pages serves this file for deep links such as /SwimChrono/label-vis.
      // Keep the requested path so the app can restore it after the redirect.
      (function () {
        var base = "/SwimChrono/";
        var path = window.location.pathname + window.location.search + window.location.hash;
        if (path.indexOf(base) === 0 && path.length > base.length) {
          try { sessionStorage.setItem("swimchrono.redirectPath", path); } catch (e) {}
        }
        window.location.replace(base);
      })();
    </script>
  </body>
</html>
